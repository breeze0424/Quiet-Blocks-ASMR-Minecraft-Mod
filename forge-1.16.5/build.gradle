plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.3.5'
group = 'com.cmcplugins.asmr'
base { archivesName = 'asmr-mc1.16.5' }
java.toolchain.languageVersion = JavaLanguageVersion.of(8)

sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'

minecraft {
    mappings channel: 'official', version: '1.16.5'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            mods { asmr { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

dependencies { minecraft ("net.minecraftforge:forge:1.16.5-${providers.gradleProperty('targetForgeVersion').orElse('36.2.42').get()}").toString() }

tasks.named('jar', Jar).configure {
    from('../LICENSE')
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
