plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.4.0'
group = 'com.cmcplugins.asmr'
def neoForge = providers.gradleProperty('loader').orElse('forge').get() == 'neoforge'
base { archivesName = neoForge ? 'asmr-mc1.20.1-neoforge' : 'asmr-mc1.20.1-forge' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            mods { asmr { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.neoforged.net/releases/' }
}

dependencies {
    minecraft (neoForge ? 'net.neoforged:forge:1.20.1-47.1.106'
        : 'net.minecraftforge:forge:1.20.1-47.1.3')
}

tasks.named('jar', Jar).configure {
    from('../LICENSE')
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
